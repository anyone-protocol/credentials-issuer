# Runs the published issuer image with its backing services. Nothing is built.
#   docker compose -f compose.published.yml up
#
# Generate keys first: bun run keys:dev  (see docs/toon-runbook.md)
include:
  - compose.yml

services:
  issuer:
    image: ghcr.io/anyone-protocol/credentials-issuer:latest
    pull_policy: always
    environment:
      NODE_ENV: production
      DB_MIGRATIONS_RUN: "true"
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEY_DOCUMENT_PATH: /keys/current.json
      ISSUER_PRIVATE_KEY_PATH: /keys/current.pem
      PROXY_PUBLIC_KEY_PATH: /keys/proxy.pub.pem
      BUNDLE_PRICE: "1.00"
    # Keys are mounted, never baked into the image. :z relabels for SELinux
    # hosts (podman on Fedora); harmless elsewhere.
    volumes:
      - ./config/keys:/keys:ro,z
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
