name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Run the stage Nomad job after publishing (leave off to build only)'
        type: boolean
        default: false
      conformance_url:
        description: 'Run the buyer harness against this URL (the TOON proxy, for M0.3)'
        type: string
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Scope scenario coverage
        run: bun run scenarios

  crossverify:
    # The other half of "published test vectors cross-verify": CIRCL judging
    # our vectors. The TypeScript side judges CIRCL's, in `test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/circl-crossverify/go.sum

      - name: Cross-verify test vectors against CIRCL
        working-directory: tools/circl-crossverify
        run: go run . -mode verify -file ../../test-vectors/rsabssa-sha384-pss-randomized.json

  publish:
    needs: [test, crossverify]
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploying is MANUAL. A push to the default branch publishes an image and stops there, so
  # merging never moves the sandbox on its own; the jobspec is run against the SHA-tagged image
  # only when someone ticks `deploy` on a workflow_dispatch.
  deploy:
    needs: [publish]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to stage
        env:
          NOMAD_CACERT: operations/admin-ui-ca.crt
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN_CREDENTIALS_ISSUER_DEPLOY }}
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
        run: |
          curl -L https://releases.hashicorp.com/nomad/1.10.2/nomad_1.10.2_linux_amd64.zip -o nomad.zip
          unzip nomad.zip
          # The jobspec pins a default commit_sha so it can be run by hand; pass the SHA that was
          # just built rather than letting that default decide what deploys.
          ./nomad job run -var="commit_sha=${GITHUB_SHA}" operations/credentials-issuer-stage.hcl

  # M0.3's scenario: the buyer harness driving request -> 402 -> pay -> retry against a deployed
  # issuer behind the TOON proxy. It needs a running sandbox, so it is dispatched with a URL
  # rather than run on every push. See docs/deployment.md.
  conformance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.conformance_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Buy a bundle through the proxy
        run: bun run harness --url "${{ inputs.conformance_url }}" --payment stub-receipt
