# Full stack: backing services (from compose.yml) plus the issuer in a container.
#   docker compose -f compose.full.yml up --build
include:
  - compose.yml

services:
  issuer:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "true"
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYRING_PATH: /keys/keyring.json
      PROXY_PUBLIC_KEY_PATH: /keys/proxy.pub.pem
    # Epoch keys are mounted, never baked into the image. Run `bun run keys:dev`
    # first; stage and live mount Vault-issued keys here instead.
    volumes:
      # :z relabels for SELinux hosts (podman on Fedora); harmless elsewhere.
      - ./config/keys:/keys:ro,z
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
